name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Las variables están cargadas como Environment variables de github-pages
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # Acepta las variables como Repository secrets o como Repository variables
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_EMAIL_DOMAIN: ${{ secrets.VITE_AUTH_EMAIL_DOMAIN || vars.VITE_AUTH_EMAIL_DOMAIN }}
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          faltan=""
          [ -z "$VITE_SUPABASE_URL" ] && faltan="$faltan VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && faltan="$faltan VITE_SUPABASE_ANON_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan:$faltan. Cargalas en Settings > Secrets and variables > Actions > pestaña 'Repository secrets' (no como Environment secrets)."
            exit 1
          fi
          echo "URL: ${VITE_SUPABASE_URL%%.supabase.co*}.supabase.co | anon key: ${#VITE_SUPABASE_ANON_KEY} caracteres"
          npm run build
      # Fallback SPA: GitHub Pages sirve 404.html para rutas desconocidas (ej. al refrescar /torneos)
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
